name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Go Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Get dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v ./...

      - name: Build Server
        run: go build -v ./cmd/server

  dashboard:
    name: Next.js Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  admin:
    name: Admin Panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Unit Tests
        run: bun run test

      - name: Build
        run: bun run build

  admin-e2e:
    name: Admin E2E Tests
    runs-on: ubuntu-latest
    needs: [backend, admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build Server
        run: go build -o server ./cmd/server

      - name: Start Backend
        run: |
          ./server &
          echo "Backend started"
          sleep 5
        env:
          SERVER_PORT: "8080"
          DATABASE_PATH: ":memory:"
          ADMIN_API_KEY: "admin_key"
          JWT_SECRET: "test-secret-for-ci"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Admin Dependencies
        working-directory: ./frontend/admin
        run: bun install

      - name: Install Playwright Browsers
        working-directory: ./frontend/admin
        run: bunx playwright install --with-deps

      - name: Run Admin Playwright Tests
        working-directory: ./frontend/admin
        run: bunx playwright test
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build Server
        run: go build -o server ./cmd/server

      - name: Start Backend
        run: |
          ./server &
          echo "Backend started"
          sleep 5
        env:
          SERVER_PORT: "8080"
          DATABASE_PATH: ":memory:"
          ADMIN_API_KEY: "admin_key"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dashboard Dependencies
        working-directory: ./dashboard
        run: bun install --frozen-lockfile

      - name: Build Dashboard
        working-directory: ./dashboard
        run: bun run build

      - name: Install Playwright Browsers
        working-directory: ./dashboard
        run: bunx playwright install --with-deps

      - name: Run Dashboard Playwright Tests
        working-directory: ./dashboard
        run: bunx playwright test
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  admin:
    name: Admin Panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun run test

      - name: Build
        run: bun run build

  admin-e2e:
    name: Admin E2E Tests
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup and Run Backend
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build Server
        run: go build -o server ./cmd/server

      - name: Start Backend
        run: |
          ./server &
          echo "Backend started"
          sleep 5
        env:
          SERVER_PORT: "8080"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:54322/postgres"
          JWT_SECRET: "test-secret-key"
          ADMIN_API_KEY: "admin_key"

      # Setup and Run Admin Tests
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ./frontend/admin
        run: bun install

      - name: Install Playwright Browsers
        working-directory: ./frontend/admin
        run: bunx playwright install --with-deps

      - name: Run Playwright Tests
        working-directory: ./frontend/admin
        run: bunx playwright test
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
