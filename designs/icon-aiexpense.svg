<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Define gradients -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>

  <!-- White circle for contrast -->
  <circle cx="256" cy="256" r="220" fill="white" opacity="0.98"/>

  <!-- Main icon group -->
  <g transform="translate(256, 256)">
    <!-- Stylized "A" letter representing AIExpense -->
    <!-- Left diagonal line of A -->
    <line x1="-50" y1="80" x2="-10" y2="-50"
          stroke="#2563EB" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right diagonal line of A -->
    <line x1="10" y1="-50" x2="50" y2="80"
          stroke="#2563EB" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Horizontal bar of A (chat bubble concept) -->
    <line x1="-30" y1="20" x2="30" y2="20"
          stroke="#2563EB" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Chat bubble indicator below A -->
    <circle cx="0" cy="50" r="8" fill="#2563EB" opacity="0.6"/>
    <circle cx="18" cy="50" r="8" fill="#2563EB" opacity="0.4"/>

    <!-- Send arrow (orange accent) -->
    <!-- Arrow shaft -->
    <line x1="60" y1="-30" x2="110" y2="-80"
          stroke="#F97316" stroke-width="16" stroke-linecap="round"/>

    <!-- Arrow head top -->
    <line x1="110" y1="-80" x2="95" y2="-60"
          stroke="#F97316" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Arrow head right -->
    <line x1="110" y1="-80" x2="130" y2="-75"
          stroke="#F97316" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Optional: Add brand text below (can be hidden for app icons) -->
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="32" font-weight="bold"
        text-anchor="middle" fill="#2563EB" opacity="0">AIExpense</text>
</svg>
