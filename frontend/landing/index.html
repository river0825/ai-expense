<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIExpense</title>
  <meta name="description" content="AIExpense A/B landing router" />
  <link rel="icon" type="image/jpeg" href="./assets/ai-bot-icon.jpeg">
  <link rel="apple-touch-icon" href="./assets/ai-bot-icon.jpeg">
  <meta http-equiv="refresh" content="0; url=./lp-x7k2.html" />
  <script>
    (function () {
      var STORAGE_KEY = "aiexpense_ab_variant";
      var STORAGE_EXP_KEY = "aiexpense_ab_variant_exp";
      var VARIANT_TO_FILE = {
        a: "lp-x7k2.html",
        b: "lp-q9m4.html"
      };
      var EXP_DAYS = 30;
      var now = Date.now();

      function chooseVariant() {
        return Math.random() < 0.5 ? "a" : "b";
      }

      function readVariant() {
        try {
          var saved = localStorage.getItem(STORAGE_KEY);
          var exp = Number(localStorage.getItem(STORAGE_EXP_KEY) || "0");
          if (saved && exp > now) return saved;
        } catch (e) {}
        return null;
      }

      function writeVariant(variant) {
        try {
          var exp = now + EXP_DAYS * 24 * 60 * 60 * 1000;
          localStorage.setItem(STORAGE_KEY, variant);
          localStorage.setItem(STORAGE_EXP_KEY, String(exp));
        } catch (e) {}
      }

      var variant = readVariant() || chooseVariant();
      writeVariant(variant);

      // For GTM / analytics integration later
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        event: "ab_variant_assigned",
        experiment_id: "lp_ab_v1",
        experiment_name: "lp_variant_test",
        variant: variant
      });

      var target = VARIANT_TO_FILE[variant] || VARIANT_TO_FILE.a;
      window.location.replace("./" + target);
    })();
  </script>
</head>
<body>
  <noscript>
    <p>JavaScript is required for A/B routing.</p>
    <p><a href="./lp-x7k2.html">Go to landing page</a></p>
    <p><a href="./lp-q9m4.html">Go to landing page variant</a></p>
  </noscript>
  <p>Redirecting...</p>
</body>
</html>
